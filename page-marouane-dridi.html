<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marouane Dridi</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #3446a8 0, transparent 38%), linear-gradient(135deg, #101426, #080b13 70%);
      color: #fff;
    }
    main {
      width: min(90vw, 850px); padding: clamp(2rem, 7vw, 5rem) 1.5rem; text-align: center;
      border: 1px solid rgba(255,255,255,.18); border-radius: 28px;
      background: rgba(255,255,255,.06); box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
    }
    p { margin: 0 0 1rem; color: #b9c3ff; letter-spacing: .24em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 6rem); line-height: 1.05; letter-spacing: -.05em; }
    .line { width: 76px; height: 4px; margin: 2rem auto 0; border-radius: 99px; background: #91a2ff; }
  </style>
</head>
<body>
  <main>
    <p>Bienvenue sur ma page</p>
    <h1>Marouane Dridi</h1>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
